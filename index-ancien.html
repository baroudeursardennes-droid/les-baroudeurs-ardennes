<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#0b3d2d">

  <title>Les Baroudeurs Ardennes</title>

  <style>

    :root {
      --vert: #0b3d2d;
      --vert2: #15533f;
      --creme: #f8f1e5;
      --or: #b88932;
      --texte: #203f34;
      --blanc: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texte);
      background: white;
    }

    a {
      text-decoration: none;
      color: inherit;
    }


    /* MENU */

    header {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 8px 4%;

      background: rgba(250,248,243,0.95);

      backdrop-filter: blur(9px);

      box-shadow: 0 2px 14px rgba(0,0,0,0.12);
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      color: var(--vert);

      font-weight: 800;
    }


    .brand img {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }


    nav {
      display: flex;
      gap: 20px;

      font-size: 0.88rem;
      font-weight: 700;
    }


    .social {
      display: flex;
      gap: 8px;
    }


    .social a {
      background: var(--vert);
      color: white;

      padding: 9px 13px;

      border-radius: 999px;

      font-weight: 800;
      font-size: 0.8rem;
    }



    /* ACCUEIL */

    .hero {
      min-height: 650px;
      height: 88svh;
      max-height: 850px;

      position: relative;

      display: flex;
      align-items: flex-end;

      padding: 100px 6% 54px;

      color: white;

      background-image: url("./assets/fond-ardennais.jpg");

      background-size: cover;

      background-position: center;

      background-repeat: no-repeat;

      overflow: hidden;
    }


    .hero::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          0deg,
          rgba(6,44,34,0.88) 0%,
          rgba(6,44,34,0.30) 65%,
          rgba(6,44,34,0.05) 100%
        );
    }


    .hero-content {
      position: relative;

      z-index: 2;

      max-width: 760px;
    }


    .hero-logo {
      width: min(300px,48vw);

      height: auto;

      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.4));
    }


    .hero h1 {
      font-size: clamp(2.6rem,6vw,5rem);

      line-height: 0.96;

      margin: 12px 0;
    }
