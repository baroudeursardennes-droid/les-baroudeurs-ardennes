<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Demande envoyée | Les Baroudeurs Ardennes</title>

  <meta name="robots" content="noindex, follow">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          rgba(16,47,37,.55),
          rgba(16,47,37,.70)
        ),
        url("assets/fond-ardennais.jpg");

      background-size: cover;
      background-position: center;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;
      color: #173f32;
    }

    .box {
      width: min(650px, 100%);
      background: #f4efe4;
      border-radius: 25px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,.25);
    }

    .logo {
      width: 190px;
      max-width: 65%;
      margin-bottom: 20px;
    }

    h1 {
      color: #174b38;
      font-size: clamp(30px,6vw,44px);
      margin: 5px 0 20px;
    }

    .check {
      font-size: 55px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    .highlight {
      font-weight: bold;
      color: #174b38;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      background: #d6a33b;
      color: #173f32;
      text-decoration: none;
      font-weight: bold;
      padding: 15px 28px;
      border-radius: 40px;
    }

    .button:hover {
      background: #e3b552;
    }

  </style>

</head>

<body>

  <main class="box">

    <img
      src="assets/logo-officiel.png"
      alt="Les Baroudeurs Ardennes"
      class="logo"
    >

    <div class="check">
      ✓
    </div>

    <h1>
      Merci !
    </h1>

    <p>
      Votre demande de partenariat
      a bien été transmise aux
      <span class="highlight">
        Baroudeurs Ardennes.
      </span>
    </p>

    <p>
      Nous prendrons connaissance de votre demande
      et reviendrons vers vous prochainement.
    </p>

    <p>
      Merci de participer à cette dynamique locale
      et de soutenir l'aventure des Baroudeurs Ardennes.
    </p>

    <a
      href="/"
      class="button">
      Retour à l'accueil
    </a>

  </main>

</body>

</html>
